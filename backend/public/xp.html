<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clarity · XP Ranking</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070f;--bg2:#0d0d1a;--bg3:#11111f;--border:#2a1f4a;--gold:#b388ff;--gold2:#d4b0ff;
 --gold-dim:#5c3d99;--text:#d8d0f0;--text-dim:#6a5f8a;--green:#7c4dff;--red:#e05580;--glow:rgba(179,136,255,.15)}
*{box-sizing:border-box}
body{margin:0;font-family:'Rajdhani',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:inherit}
.top{position:relative;text-align:center;padding:32px 20px 20px;border-bottom:1px solid var(--border)}
.back{position:absolute;top:24px;left:24px;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;
 color:var(--text-dim);background:var(--bg3);border:1px solid var(--border);padding:8px 14px;text-decoration:none;
 clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);transition:all .2s}
.back:hover{color:var(--gold);border-color:var(--gold-dim)}
.eyebrow{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--text-dim)}
h1{font-family:'Cinzel',serif;font-size:30px;margin:6px 0 2px;color:var(--gold);text-shadow:0 0 24px var(--glow)}
.sub{font-size:13px;color:var(--text-dim);letter-spacing:2px;text-transform:uppercase}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
.gate{max-width:340px;margin:60px auto;text-align:center}
input{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:inherit;
 font-size:16px;padding:11px 13px;text-align:center;letter-spacing:3px;margin-bottom:12px}
input:focus{outline:none;border-color:var(--gold-dim)}
button{width:100%;background:var(--bg3);border:1px solid var(--gold-dim);color:var(--gold);font-family:inherit;
 font-size:13px;font-weight:600;letter-spacing:3px;text-transform:uppercase;padding:11px;cursor:pointer;transition:all .2s}
button:hover{background:var(--border)}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.tab{background:var(--bg3);border:1px solid var(--border);color:var(--text-dim);font-size:13px;font-weight:500;
 letter-spacing:1.5px;text-transform:uppercase;padding:8px 15px;cursor:pointer;width:auto;
 clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.tab:hover{color:var(--gold2)}
.tab.on{background:var(--border);color:var(--gold);border-color:var(--gold-dim)}
table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);font-weight:600;
 text-align:right;padding:0 10px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
th:nth-child(2){text-align:left}
td{font-size:15px;font-weight:600;text-align:right;padding:7px 10px;border-bottom:1px solid rgba(42,31,74,.5);white-space:nowrap}
td:nth-child(2){text-align:left}
.rk{color:var(--text-dim);width:52px}
.rk1{color:#ffd76e}.rk2{color:#cfd3dc}.rk3{color:#e0a878}
.xp{color:var(--gold2)}
.lv{color:var(--text-dim);font-size:13px}
.prog{color:var(--text-dim);font-size:13px}
.meta{color:var(--text-dim);font-size:13px;margin:0 0 14px}
.note{color:var(--text-dim);font-size:12px;margin-top:22px;line-height:1.6;max-width:70ch}
</style>
</head>
<body>
<div class="top">
  <a class="back" href="/">← Leaderboard</a>
  <div class="eyebrow">Black Desert Online · EU</div>
  <h1>XP RANKING</h1>
  <div class="sub" id="sub">Lifeskill-XP je Jahr</div>
</div>
<div class="wrap" id="app"></div>

<script>
const app = document.getElementById('app');
const fmt = (n) => (n / 1e9).toLocaleString('de-DE', { maximumFractionDigits: 1 }) + ' Mrd';
const LABEL = { cooking:'🍳 Cooking', processing:'⚙️ Processing', gathering:'🌿 Gathering', hunting:'🏹 Hunting',
  alchemy:'⚗️ Alchemy', farming:'🌾 Farming', training:'🐴 Training', fishing:'🎣 Fishing',
  sailing:'⛵ Sailing', barter:'🚢 Barter' };

function gate(msg) {
  app.innerHTML = `<div class="gate">
      <input id="pw" type="password" placeholder="PASSWORT" autofocus>
      <button id="go">Anmelden</button>
      <div class="err">${msg || ''}</div>
    </div>`;
  const send = () => {
    const pw = document.getElementById('pw').value;
    fetch('/api/xp/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: pw }) })
      .then(r => r.ok ? load() : r.json().then(j => gate(j.error || 'Falsches Passwort')))
      .catch(() => gate('Verbindung fehlgeschlagen'));
  };
  document.getElementById('go').onclick = send;
  document.getElementById('pw').onkeydown = (e) => { if (e.key === 'Enter') send(); };
}

function render(d) {
  document.getElementById('sub').textContent = `${d.year} · ${d.from} bis ${d.to}`;
  const tabs = ['overall', ...d.skills];
  let active = 'overall';
  const draw = () => {
    const isAll = active === 'overall';
    const s = isAll ? null : d.perSkill[active];
    const rows = isAll ? d.overall : s.rows;
    app.innerHTML = `
      <div class="tabs">${tabs.map(t => `<button class="tab ${t===active?'on':''}" data-t="${t}">${t==='overall'?'★ Gesamt':LABEL[t]}</button>`).join('')}</div>
      <p class="meta">${isAll
        ? `${rows.length} Spieler mit Zuwachs · zusammen ${fmt(rows.reduce((a,b)=>a+b.xp,0))}`
        : `${s.players} Spieler mit Zuwachs · zusammen ${fmt(s.total)}`}</p>
      <table><thead><tr><th class="rk">#</th><th>Familie</th>${isAll?'':'<th>Level</th><th>Fortschritt</th>'}<th>XP ${d.year}</th></tr></thead>
      <tbody>${rows.map(r => `<tr>
        <td class="rk ${r.rank<=3?'rk'+r.rank:''}">${r.rank<=3?['🥇','🥈','🥉'][r.rank-1]:r.rank}</td>
        <td>${r.name}</td>
        ${isAll?'':`<td class="lv">+${r.levels}</td><td class="prog">${r.from} → ${r.to}</td>`}
        <td class="xp">${fmt(r.xp)}</td></tr>`).join('')}</tbody></table>
      <p class="note">Gerechnet aus den täglichen Snapshots: XP-Summe des letzten Standes minus die des ersten,
        je Lifeskill mit seiner eigenen Skala — Barter liegt rund tausendfach niedriger als der Rest, ein Barter-Level
        ist also nicht mit einem Cooking-Level vergleichbar. Wer im Jahr erst später erfasst wurde, wird ab seinem
        ersten Snapshot gewertet; wo der Startwert fehlt, bleibt der Skill außen vor. ${d.note}</p>`;
    app.querySelectorAll('.tab').forEach(b => b.onclick = () => { active = b.dataset.t; draw(); });
  };
  draw();
}

function load() {
  app.innerHTML = '<p class="meta">Lade …</p>';
  fetch('/api/xp/ranking?year=2026')
    .then(r => r.status === 401 ? gate() : r.json().then(render))
    .catch(() => { app.innerHTML = '<p class="meta">Daten konnten nicht geladen werden.</p>'; });
}
fetch('/api/xp/session').then(r => r.json()).then(j => j.ok ? load() : gate()).catch(() => gate());
</script>
</body>
</html>
